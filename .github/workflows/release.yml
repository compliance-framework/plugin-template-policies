name: release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release:
    # The template never releases: skip this in the template repo, run it in repos created from it.
    if: ${{ !github.event.repository.is_template }}
    uses: compliance-framework/workflows/.github/workflows/release-policies.yml@6e7fc9c04b59c7d1117938da397f8a6f8df036ab # v1.5.2
    with:
      opa-version: "1.14.1"
      directory: policies
    permissions:
      contents: read
      packages: write
    secrets: inherit
